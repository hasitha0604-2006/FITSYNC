<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_bent_over_row" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow_bent_over_row">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad_bent_over_row)" stroke="#334155" stroke-width="2"/>
  
  <!-- Animated Grid Lines -->
  <line x1="40" y1="230" x2="360" y2="230" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Graphical Pose Figure with Smooth Keyframe Animations -->
  <g transform="translate(200, 140)">
    <style>
      @keyframes pulseAnim_bent_over_row {
        0% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.03); }
        100% { transform: translateY(0px) scale(1); }
      }
      @keyframes ringAnim_bent_over_row {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .figure_bent_over_row {
        animation: pulseAnim_bent_over_row 2.4s ease-in-out infinite;
        transform-origin: center center;
      }
    </style>
    
    <!-- Outer Focus Ring -->
    <circle cx="0" cy="-10" r="65" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
    
    <!-- Pose Avatar Graphic -->
    <g class="figure_bent_over_row">
      <!-- Head -->
      <circle cx="0" cy="-45" r="14" fill="#3b82f6" filter="url(#glow_bent_over_row)"/>
      <!-- Torso -->
      <line x1="0" y1="-30" x2="0" y2="20" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
      <!-- Arms -->
      <path d="M-28 -15 L0 -25 L28 -15" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
      <!-- Weights/Bar Graphic -->
      <circle cx="-32" cy="-15" r="8" fill="#38bdf8"/>
      <circle cx="32" cy="-15" r="8" fill="#38bdf8"/>
      <line x1="-32" y1="-15" x2="32" y2="-15" stroke="#38bdf8" stroke-width="3"/>
      <!-- Legs -->
      <line x1="0" y1="20" x2="-18" y2="60" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
      <line x1="0" y1="20" x2="18" y2="60" stroke="#3b82f6" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Info Overlay Tag -->
  <rect x="20" y="20" width="160" height="32" rx="8" fill="#1e293b" opacity="0.9" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="32" y="41" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">FITSYNC DEMO</text>
  
  <text x="200" y="260" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">BENT OVER ROW</text>
  <text x="200" y="280" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Middle Back · Lats · Biceps</text>
</svg>