<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />
  
  <g transform="translate(20, 30)">
    <rect x="0" y="0" width="65" height="22" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
    <text x="32.5" y="15" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="800">YOGA</text>
  </g>

  <!-- Anatomical Pose Visualization Canvas -->
  <g transform="translate(200, 140)">
    <!-- Aura Glow Ring -->
    <circle cx="0" cy="0" r="60" fill="#38bdf8" fill-opacity="0.05" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    
    <!-- Pose Silhouette Stick Art -->
    <circle cx="0" cy="-40" r="14" fill="#38bdf8" />
    <path d="M 0,-26 L 0,20 L -25,55 M 0,20 L 25,55" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 0,-15 L -35,-35 M 0,-15 L 35,-35" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Pose Information Overlay -->
  <g transform="translate(20, 230)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="900">Cobra Pose (Bhujangasana)</text>
    <text x="0" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Chest lifted, lower back extension, elbows tucked</text>
  </g>
