{% extends "base.html" %}

{% block content %}
<div class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6 w-full select-none">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl shadow-black/40">
    
    <!-- Header -->
    <div class="flex flex-col items-center text-center mb-8">
      <div class="p-2.5 bg-emerald-500/10 text-emerald-450 rounded-2xl mb-3">
        <i data-lucide="activity" class="h-8 w-8"></i>
      </div>
      <h2 class="text-xl font-bold tracking-tight">Welcome Back</h2>
      <p class="text-slate-500 text-xs mt-1">Log in to your lifestyle dashboard</p>
    </div>

    <!-- Demo Account Callout -->
    <div class="mb-6 bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-xl">
      <div class="flex items-center justify-between">
        <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wide">🎯 SIH Demo Bypass Credentials</span>
        <button 
          type="button"
          onclick="fillDemoCredentials()"
          class="text-[9px] bg-emerald-500 hover:bg-emerald-600 text-white px-2 py-0.5 rounded font-bold transition-all shadow shadow-emerald-500/10"
        >
          Fill Demo
        </button>
      </div>
      <div class="text-[11px] text-slate-400 space-y-0.5 mt-2 font-medium">
        <p><span class="font-semibold text-slate-350">Email:</span> demo@fitsync.ai</p>
        <p><span class="font-semibold text-slate-350">Password:</span> Demo@123</p>
      </div>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
      <div>
        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">
          Email Address
        </label>
        <div class="relative">
          <i data-lucide="mail" class="absolute left-3.5 top-3.5 h-4.5 w-4.5 text-slate-500"></i>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="you@college.edu"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 pl-11 pr-4 text-xs text-white placeholder-slate-700 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-medium"
          />
        </div>
      </div>

      <div>
        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">
          Password
        </label>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-3.5 top-3.5 h-4.5 w-4.5 text-slate-500"></i>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="••••••••"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 pl-11 pr-4 text-xs text-white placeholder-slate-700 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-medium"
          />
        </div>
      </div>

      <button
        type="submit"
        class="w-full flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl transition-all shadow-md shadow-emerald-500/10 mt-6 text-xs"
      >
        Sign In
        <i data-lucide="arrow-right" class="h-4 w-4"></i>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-850 text-center">
      <a
        href="{{ url_for('register') }}"
        class="text-xs text-slate-450 hover:text-white transition-colors font-semibold"
      >
        Don't have an account? Sign Up
      </a>
    </div>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function fillDemoCredentials() {
    document.getElementById('email').value = 'demo@fitsync.ai';
    document.getElementById('password').value = 'Demo@123';
  }
</script>
{% endblock %}
