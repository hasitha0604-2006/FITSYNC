{% extends "base.html" %}

{% block content %}
<div class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6 w-full select-none relative overflow-hidden">
  <!-- Ambient Glow Spots -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none animate-pulse"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-2xl border border-slate-800/80 hover:border-emerald-500/30 p-8 rounded-3xl shadow-2xl shadow-black/60 relative z-10 transition-all duration-300">
    
    <!-- Header -->
    <div class="flex flex-col items-center text-center mb-8">
      <div class="p-3 bg-gradient-to-tr from-emerald-500/20 to-teal-500/20 text-emerald-400 rounded-2xl mb-3 border border-emerald-500/30 shadow-lg shadow-emerald-500/10">
        <i data-lucide="activity" class="h-8 w-8"></i>
      </div>
      <h2 class="text-2xl font-black tracking-tight text-white">Welcome Back</h2>
      <p class="text-slate-400 text-xs mt-1">Log in to your FitSync AI dashboard</p>
    </div>



    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
      <div>
        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">
          Email Address
        </label>
        <div class="relative">
          <i data-lucide="mail" class="absolute left-3.5 top-3.5 h-4.5 w-4.5 text-slate-500"></i>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="you@college.edu"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 pl-11 pr-4 text-xs text-white placeholder-slate-700 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-medium"
          />
        </div>
      </div>

      <div>
        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">
          Password
        </label>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-3.5 top-3.5 h-4.5 w-4.5 text-slate-500"></i>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="••••••••"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 pl-11 pr-4 text-xs text-white placeholder-slate-700 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-medium"
          />
        </div>
      </div>

      <button
        type="submit"
        class="w-full flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl transition-all shadow-md shadow-emerald-500/10 mt-6 text-xs"
      >
        Sign In
        <i data-lucide="arrow-right" class="h-4 w-4"></i>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-850 text-center">
      <a
        href="{{ url_for('register') }}"
        class="text-xs text-slate-450 hover:text-white transition-colors font-semibold"
      >
        Don't have an account? Sign Up
      </a>
    </div>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function fillDemoCredentials() {
    document.getElementById('email').value = 'demo@fitsync.ai';
    document.getElementById('password').value = 'Demo@123';
  }
</script>
{% endblock %}
