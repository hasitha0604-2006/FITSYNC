<!-- JavaScript Engine to Control the Anatomy Highlight -->
<script>
  function clearAnatomyHighlight(containerSelector) {
    const parent = containerSelector ? document.querySelector(containerSelector) : document;
    if (!parent) return;
    parent.querySelectorAll('.muscle-group-path').forEach(el => {
      el.classList.remove('primary-highlight', 'secondary-highlight');
    });
  }

  function highlightAnatomyMuscles(primaryList, secondaryList, containerSelector) {
    clearAnatomyHighlight(containerSelector);
    const parent = containerSelector ? document.querySelector(containerSelector) : document;
    if (!parent) return;
    
    // Normalize and map muscle names to SVG groups
    const mapMuscleGroup = (name) => {
      if (!name) return [];
      const n = name.trim().toLowerCase();
      
      // Map common naming variants to data-muscle attributes
      if (n.includes('chest') || n.includes('pectoral')) return ['Chest'];
      if (n.includes('back') || n.includes('lat') || n.includes('trap') || n.includes('rhomboid')) return ['Back'];
      if (n.includes('shoulder') || n.includes('deltoid')) return ['Shoulders'];
      if (n.includes('bicep')) return ['Biceps'];
      if (n.includes('tricep')) return ['Triceps'];
      if (n.includes('forearm')) return ['Forearms'];
      if (n.includes('core') || n.includes('ab') || n.includes('oblique')) return ['Core'];
      if (n.includes('glute')) return ['Glutes'];
      if (n.includes('quad') || n.includes('hamstring') || n.includes('thigh') || n.includes('leg') || n.includes('calves') || n.includes('calf')) return ['Legs'];
      return [];
    };

    const highlightGroup = (muscleName, className) => {
      const targets = mapMuscleGroup(muscleName);
      targets.forEach(t => {
        parent.querySelectorAll(`.muscle-group-path[data-muscle="${t}"]`).forEach(path => {
          path.classList.add(className);
        });
      });
    };

    if (primaryList) {
      if (typeof primaryList === 'string') {
        highlightGroup(primaryList, 'primary-highlight');
      } else if (Array.isArray(primaryList)) {
        primaryList.forEach(m => highlightGroup(m, 'primary-highlight'));
      }
    }

    if (secondaryList) {
      if (typeof secondaryList === 'string') {
        highlightGroup(secondaryList, 'secondary-highlight');
      } else if (Array.isArray(secondaryList)) {
        secondaryList.forEach(m => highlightGroup(m, 'secondary-highlight'));
      }
    }
  }
</script>
